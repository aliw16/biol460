<script>

["Glia",0,"Microglia / ependymal / satellite cells","Phagocytes of CNS / line ventricles, make CSF (choroid plexus) / support ganglia cell bodies in PNS"],

["Glia",0,"Demyelinating diseases","Guillain-Barré: T cells attack PNS myelin. MS: autoimmune attack on CNS myelin"],
["AP",0,"Resting potential and what sets it","≈ −70 mV: Na+/K+ pump, K+ leak channels (high K+ inside, Na+ outside), large negative molecules inside"],
["AP",0,"Steps of an action potential","Depolarize to threshold (~−55 mV) → voltage-gated Na+ open (positive feedback) → peak ≈ +40 → Na+ inactivate, K+ open → repolarize → hyperpolarize"],
["AP",0,"All-or-none: how is intensity coded?","Amplitude never changes; brain reads frequency of APs and number of neurons recruited"],
["AP",0,"Refractory periods","Absolute: no AP possible (Na+ channels inactivated). Relative: stronger stimulus needed. Ensures one-way travel + caps frequency"],
["AP",0,"Why does myelin speed conduction? Speeds?","Saltatory conduction: AP regenerates only at nodes of Ranvier (every 1–2 mm). Also bigger diameter. Thin unmyelinated ≈1 m/s, thick myelinated ≈100 m/s"],
["AP",1,"Graded potentials (EPSPs) as they move toward the axon hillock","They degrade in strength; must still reach ≈ −55 mV at the initial segment"],
["AP",0,"K+ channel types","Leak channels (always open) vs voltage-gated K+ (open at specific potentials). Na+: no leak, only voltage-gated"],
["Synapse",1,"Which ion movements make EPSP vs IPSP?","EPSP: Na+ influx, Ca2+ influx. IPSP: K+ efflux, Cl− influx"],
["Synapse",0,"Steps of chemical synaptic transmission","AP at terminal → voltage-gated Ca2+ open → vesicles fuse, NT released → binds postsynaptic receptor → EPSP/IPSP → NT cleared (enzyme, reuptake, glia)"],
["Synapse",0,"EPSP vs action potential","EPSP: graded, local, summates, no refractory period. AP: all-or-none, regenerated, no summation, refractory"],
["Synapse",0,"Electrical synapse","Gap junctions (connexins) span two cells' membranes; two-way, fast"],
["Synapse",0,"Ligand-gated vs G-protein coupled","Ligand-gated: receptor IS the channel, fast. GPCR: α subunit swaps GDP→GTP, dissociates, opens channel or activates enzyme/2nd messenger; slower, longer, amplified"],
["Synapse",0,"Spatial vs temporal summation","Spatial: many presynaptic neurons at once. Temporal: one neuron firing rapidly. Summed at axon hillock; EPSPs vs IPSPs decide if threshold is hit"],
["Synapse",0,"Divergence vs convergence","One presynaptic neuron → many postsynaptic / many presynaptic → one postsynaptic"],
["Synapse",0,"Postsynaptic vs presynaptic inhibition","Post: glycine (spinal cord)/GABA (brain) → hyperpolarize. Pre: axoaxonic synapse blocks Ca2+ channels, less NT release (opioids reduce substance P)"],
["ACh",0,"Nicotinic vs muscarinic receptors","Nicotinic: ligand-gated, skeletal muscle end plate, autonomic ganglia; excitatory. Muscarinic: GPCR, smooth/cardiac muscle, glands; excitatory or inhibitory by tissue"],
["ACh",1,"Why is ACh inhibitory in the heart?","M2 muscarinic receptor → G-protein opens K+ channels → K+ efflux, hyperpolarization → slows SA node (vagus)"],
["ACh",0,"Myasthenia gravis","Autoimmune antibodies block nicotinic receptors at motor end plate → weakness (eyes, eyelids, face). Treat with AChE inhibitors"],
["Monoamines",0,"MAO inhibitors vs SSRIs","MAOI: block breakdown of dopamine, serotonin, NE (depression, Parkinson's; tyramine/hypertensive crisis risk). SSRI: block serotonin reuptake only (depression, anxiety)"],
["Monoamines",0,"Dopamine systems","Nigrostriatal (substantia nigra→striatum, motor; Parkinson's). Mesolimbic (reward, addiction; excess in schizophrenia)"],
["Monoamines",0,"Serotonin and norepinephrine","Serotonin: raphe nuclei, from tryptophan, mood/appetite. NE: sympathetic neurons + arousal areas in CNS; amphetamines boost NE pathways. Both use metabotropic (G-protein, cAMP) receptors"],
["Other NTs",0,"Glutamate","Major excitatory NT (80% of cortical synapses). NMDA + AMPA work together in memory (Mg2+ block). Astrocytes take it up"],
["Other NTs",0,"Glycine vs GABA","Glycine: spinal cord, Cl− in, relaxes antagonist muscles/diaphragm; strychnine blocks it. GABA: brain, Cl− channel, ~1/3 of neurons"],
["Other NTs",0,"Endocannabinoids","Fatty acids made on demand, no vesicles, retrograde (2-AG) → suppress GABA release (DSI). Same receptors as THC"],
["Other NTs",0,"NO and CO","Gases, no vesicles, diffuse in, activate cGMP. NO from L-arginine: vasodilation, erection (Viagra blocks cGMP breakdown). CO from heme: olfaction, cerebellum"],
["Other NTs",0,"Neuropeptides","CCK (satiety), substance P (pain), endogenous opioids (enkephalins, endorphins, dynorphins), neuropeptide Y (hunger; leptin inhibits)"],
["Other NTs",0,"ATP / adenosine","Purines, P1 = adenosine, P2 = ATP. Adenosine promotes sleep (caffeine blocks it)"],
["Plasticity",1,"LTP vs LTD and calcium","LTP: rapid large Ca2+ rise → AMPA receptors inserted, spines enlarge. LTD: small prolonged Ca2+ rise → AMPA removed, spines shrink"],
["Plasticity",1,"Limbic system and LTP","Limbic ability to create/cultivate LTP (or depress it) can strengthen or weaken long-term memories"],
["Plasticity",0,"Adult neurogenesis sites","Subventricular zone (→ striatum, motor/cognition) and hippocampal subgranular zone (interneurons, memory)"],
["Cerebrum",0,"Lobes and key functions","Frontal: voluntary motor, executive. Parietal: somatosensory. Temporal: hearing, memory. Occipital: vision. Insula: taste, visceral/pain, autonomic"],
["Cerebrum",0,"Precentral vs postcentral gyrus","Precentral (frontal) = primary motor cortex, upper motor neurons. Postcentral (parietal) = somatosensory cortex. Separated by central sulcus. Homunculus: hands, lips, face are huge"],
["Cerebrum",0,"Wernicke's aphasia vs Broca's aphasia","Wernicke (temporal/parietal): can speak fluently but 'word salad', can't comprehend. Broca (frontal): understands but slow, poorly articulated speech. Angular gyrus: reading/writing"],
["Cerebrum",0,"Lateralization","Each hemisphere controls the opposite body side. Left: language, analytics, calculation. Right: visuospatial, faces, music. Corpus callosum links them"],
["Extras",0,"EEG waves","Alpha: awake, relaxed, eyes closed. Beta: active mental work. Theta: REM / attention. Delta: slow-wave sleep (abnormal in awake adult)"],
["Extras",0,"Sleep NTs and stages","Histamine = wakefulness; adenosine + GABA = sleep. Non-REM first (declarative memory), REM later (nondeclarative), ~90-min cycles"],
["Basal nuclei",1,"Basal nuclei structures","Claustrum, corpus striatum (caudate + lentiform nucleus = putamen + globus pallidus). Act as a filter for motor commands. Substantia nigra will be asked about"],
["Basal nuclei",1,"Motor circuit, per your notes","Cortex (thought to move, glutamate) → primary motor cortex; basal nuclei refine it: putamen/caudate → globus pallidus → thalamus via GABA (inhibitory) 'brakes'; substantia nigra supplies dopamine; thalamus exits back to cortex with glutamate. Initial signal is jerky, not graded: M1 can't brake itself"],
["Basal nuclei",0,"Parkinson's vs Huntington's","Parkinson's: substantia nigra dopamine neurons die. Huntington's: GABA neurons degenerate, involuntary movements"],
["Memory",0,"Memory types","Declarative/explicit: semantic (facts), episodic (events). Nondeclarative/implicit: procedural skills (basal nuclei, cerebellum). Working memory: prefrontal cortex, seconds"],
["Memory",0,"Memory brain areas","Hippocampus: acquire + consolidate. Amygdala: short→long term. Prefrontal: working memory. Inferior temporal: visual storage. Consolidation needs protein synthesis, new synapses"],
["Extras",0,"Brain stats","~100 billion neurons; ~1.5 kg (3–3.5 lb); gets 15% of total blood flow. Gray matter = cell bodies + dendrites (cortex, deep nuclei). White matter = myelinated axons (tracts)"],
["Extras",0,"Cerebrum basics","From telencephalon; ~80% of brain mass; higher mental function. Right + left hemispheres joined by corpus callosum. Cortex = 2–4 mm gray matter; gyri (folds) + sulci (grooves) = convolutions, which add surface area"],
["Extras",0,"Insula","Not visible on surface. Memory encoding, integrates sensory (esp. pain, taste, smell, hearing) with visceral responses; controls autonomic/cardiovascular responses"],
["Extras",0,"Mirror neurons","Frontal + parietal lobes; goal-directed actions and copying others; linked via insula/cingulate gyrus to emotion centers; may help social + language learning; implicated in autism"],
["Extras",0,"Brain imaging: CT, PET, MRI","CT: X-ray absorption by soft tissue. PET: positron-emitting tracer, gamma rays from active tissue (cancer staging, brain metabolism, depression). MRI: protons aligned by magnets, water content differs; clear gray matter / white matter / CSF"],
["Extras",0,"Brain imaging: fMRI, MEG, EEG","fMRI: BOLD response, glutamate → vasodilation → more oxyhemoglobin in active regions (brain surgery planning). MEG: magnetic fields from postsynaptic currents, SQUID sensors, more accurate than EEG (epilepsy/tumor surgery). EEG: scalp electrodes detect synaptic potentials of cortical cell bodies + dendrites"],
["Extras",0,"Sleep: REM vs non-REM details","REM: dreams, theta waves, limbic system very active, irregular breathing/heart rate, nondeclarative memory. Non-REM: 4 stages, stages 3–4 = slow-wave (delta), regular breathing, repair of free-radical damage, declarative + spatial memory. Slow-wave early in night, REM later; people wake naturally from REM"],
["Extras",0,"Sleep and the glymphatic system","Glymphatic system clears waste (abnormal Alzheimer's proteins), mainly active in deep sleep; less effective with age. ~3 hr delay between learning and sleep improves declarative consolidation"],
["Extras",0,"Neurotrophins","NGF, BDNF, GDNF, NT-3, NT-4/5. Promote fetal neuron growth; in adults maintain sympathetic ganglia + help sensory neuron regeneration"],
["Glia",0,"Blood-brain barrier: what forms it?","Tight junctions between capillary endothelium + astrocyte end-feet (and pericytes). Blocks paracellular transport; lipid-soluble substances pass, others need transporters. Complicates drug delivery to the CNS"],

["Neurons",0,"Neuron anatomy: parts and jobs","Dendrites receive input (graded potentials). Cell body: nucleus, metabolic center. Axon hillock + initial segment: where APs are generated. Axon collaterals branch; nodes of Ranvier gaps in myelin; axon terminals release NT"],
["AP",0,"Unmyelinated vs myelinated conduction","Unmyelinated: AP regenerated at every patch of membrane, slow, same amplitude (no decrement). Myelinated: only at nodes, myelin insulates, improves cable properties"],
["AP",0,"Excitability and electrochemical gradient","Neurons and muscle cells can change membrane potential by changing ion permeability. Ions follow their electrochemical gradient (concentration + charge). Ion currents occur only where channels are"],
["Synapse",0,"Synapse classification","Pre → post neuron. Axodendritic (most common), axosomatic, axoaxonic. PNS synapse onto muscle/gland = neuromuscular junction. Electrical (gap junctions) vs chemical"],
["Synapse",0,"G-protein cycle (Table 7.6)","Unbound: α-GDP with β/γ attached to receptor. Ligand binds → α swaps GDP for GTP and dissociates. α or βγ goes to effector (channel or enzyme). α hydrolyzes GTP→GDP, subunits reassemble. NE: G-protein → adenylate cyclase → cAMP → protein kinase → phosphorylates channels/enzymes/genes"],
["ACh",0,"Acetylcholinesterase","Breaks down ACh in the cleft. Inhibitors (neostigmine etc.) raise ACh: treat myasthenia gravis + Alzheimer's; nerve gas and organophosphates overstimulate and kill"],
["ACh",0,"Neuromuscular junction sequence","Somatic motor neuron → ACh binds nicotinic receptors on motor end plate → end plate potential (an EPSP) → opens voltage-gated Na+ → muscle AP → contraction. Autonomic parasympathetic neurons mostly use ACh"],
["Other NTs",0,"Hydrogen sulfide (H2S)","Made by nervous, cardiovascular, pulmonary systems; relaxes vessels (blood pressure), modulates neurotransmission, reduces lung inflammation"],
["Plasticity",0,"Dendritic spines and plasticity","Spines enlarge in LTP and shrink in LTD. LTD occurs on less-used pathways (pruning); inappropriate LTD impairs learning"],
["Cerebrum",0,"Cerebral lateralization and split brain","Corpus callosum is severed in severe epilepsy (split brain). Somatosensory input from each side projects to the opposite postcentral gyrus (decussation)"],
["Cerebrum",0,"Speech pathway","Hearing/vision → Wernicke's area → arcuate fasciculus → Broca's area → primary motor cortex. Angular gyrus (parietal/occipital/temporal junction) integrates auditory, visual, somatosensory; damage → reading/writing aphasias. TIAs often hit speech areas with full recovery"],
["Cerebrum",0,"Limbic system structures","Network involved in emotional drives ('smell brain'): cingulate gyrus, septal + preoptic nuclei, olfactory bulb/tract, hypothalamus, mammillary body, amygdaloid body, hippocampus, fornix"],
["Memory",0,"Long-term memory: what changes?","Gene activation, mRNA, protein synthesis, new synapses; neurons need rapid energy. Hippocampus + orbitofrontal cortex build cognitive maps; sleep moves memories to storage. Limbic system can enhance or inhibit storage"],
["ACh",0,"Drug origins (Table 7.5)","Botulinum: Clostridium bacteria. Curare: South American tree resin. α-Bungarotoxin: Bungarus snake venom. Saxitoxin: red tide algae. Tetrodotoxin: pufferfish. Nerve gas: artificial. Neostigmine: Nigerian bean. Strychnine: Asian tree seeds"],
["ACh",0,"Agonist vs antagonist","Agonist stimulates a receptor (nicotine at nicotinic, muscarine at muscarinic). Antagonist inhibits it (curare at nicotinic, atropine at muscarinic)"],
["ACh",0,"Where is ACh excitatory vs inhibitory?","Excitatory: all somatic motor neurons, some autonomic motor neurons, some CNS. Inhibitory: some autonomic motor neurons (e.g., vagus slowing the heart)"],
["ACh",0,"Nicotinic receptor behavior","Ligand-gated; opens to Na+ and K+, but more Na+ in than K+ out → EPSP (end plate potential). Binding of ACh opens the channel; closed until neurotransmitter binds"],
["Glia",0,"Neurilemma and myelin structure","Schwann cell wraps one axon segment in many layers of lipid membrane = myelin. Outer cytoplasm + nucleus = neurilemma, around all PNS axons (needed for regeneration). CNS lacks it"],
["Glia",0,"Are glial cells excitable?","No, non-conducting support cells. Astrocytes respond to Ca2+ changes, not action potentials"],
["Neurons",0,"Dendrites: what do they do?","Receive input from other neurons, convert chemical signals to graded electrical ones; involved in learning, memory, regulation"],
["AP",0,"Cable properties","Charge spreads passively and weakens with distance; bigger axon diameter and myelin reduce loss. This is why graded potentials decay but APs are regenerated"],
["AP",0,"Voltage-gated Na+ channel states","Closed at rest → open on depolarization → inactivated (refractory) until membrane repolarizes"],
["Synapse",0,"Graded EPSPs and the hillock","EPSPs weaken as they travel to the axon hillock; they must still be strong enough to reach about −55 mV at the initial segment ★"],
["Synapse",0,"Monoamine inactivation","Reuptake into the terminal, then MAO breaks monoamines down. SSRIs block reuptake; MAOIs block degradation"],
["Synapse",0,"NE receptors: metabotropic","NE receptors in CNS are G-protein coupled: G-protein → adenylate cyclase → cAMP → protein kinase → phosphorylates channels, enzymes, genes"],
["Plasticity",0,"NMDA and AMPA together","Both are glutamate ion channels. NMDA is blocked by Mg2+; once depolarized by AMPA, Mg2+ leaves, Ca2+ enters, triggering LTP"],
["Other NTs",0,"Huntington's disease","Loss of GABA-secreting neurons → involuntary movements and cognitive decline"],
["Other NTs",0,"Runner's high","Endogenous opioids (endorphins) → euphoria and reward after exercise"],
["CSF",0,"CSF reabsorption","Through arachnoid villi/granulations into dural sinuses, then to blood and lymphatics. CSF cushions, removes waste, protects chemical environment"],
["Extras",0,"CNS regeneration limits","Injury causes collaterals to sprout but central axons regrow poorly. Nogo from oligodendrocytes inhibits regrowth; scarring also blocks"],
["Basal nuclei",1,"Role of the basal nuclei","Acts as a filter for motor commands. Info flows cortex → basal nuclei → thalamus → cortex; substantia nigra dopamine modulates it"],
["Cerebrum",0,"What is the homunculus?","Map of body on motor and sensory gyri; fine control or detailed sensation (hands, lips, face) gets disproportionately large cortex. Motor map is precentral; sensory is postcentral"],

["Neurons",0,"PNS definition","Cranial nerves and spinal nerves (plus ganglia): link the CNS to limbs and organs. Nerve = axons in the PNS; may be mixed"],

["Plasticity",0,"CREB and LTP","CREB activation drives gene expression changes that make LTP long-lasting (new proteins, synapses), along with AMPA receptor insertion"],
["Cerebrum",0,"Limbic system functions","Emotion, memory, motivation. Hippocampus, amygdala, hypothalamus, cingulate gyrus. Can enhance or inhibit long-term memory storage ★"],
["AP",0,"Threshold + RMP numbers","Resting about −70 mV; threshold about −55 mV; peak about +40 mV"],

["SG 3. Nicotinic vs muscarinic ACh receptors","Nicotinic: ligand-gated channel (receptor is the channel), fast, always excitatory; skeletal muscle end plate, autonomic ganglia; nicotine agonist, curare antagonist. Muscarinic: G-protein coupled, slower; smooth + cardiac muscle, glands, CNS; excitatory or inhibitory by tissue (heart: K+ efflux slows rate); muscarine agonist, atropine antagonist."],

["SG 9. EPSP vs IPSP","EPSP: depolarizing, Na+ (and Ca2+) influx, moves toward threshold. IPSP: hyperpolarizing, Cl- influx or K+ efflux, moves away from threshold. Both are graded, local, summate, decay with distance, and have no refractory period."],

function bl(){const s=BL[bs],b=S.b||{};
const hd=`<div class="row">${BL.map((x,i)=>`<button class="${i==bs?'on':''}" onclick="bs=${i};bst=0;render()">${i+1}${b[i]!=null?' · '+b[i]+'%':''}</button>`).join('')}</div>`;
if(bst==0)$('v').innerHTML=hd+`<div class="card"><div class="tag">Step 1 · Blurt</div><h3 style="margin-top:0">${s[0]}</h3><p>Close your notes. Write everything you can remember about: <b>${s[1]}</b>. Include terms, ions, structures, and examples.</p><textarea class="bt" oninput="bt[bs]=this.value" placeholder="Blurt it all out here...">${bt[bs]||''}</textarea><div class="row"><button class="on" onclick="bst=1;render()">Done blurting: test my details →</button></div></div>`;
else $('v').innerHTML=hd+`<div class="card"><div class="tag">Step 2 · Fill the blanks</div><h3 style="margin-top:0">${s[0]}</h3><div class="small">Type the missing terms, then check. Compare against your blurt: what did you leave out?</div>${s[2].map(l=>`<div class="bl">• ${cz(l)}</div>`).join('')}<div class="row"><button class="on" onclick="bc(0)">Check</button><button onclick="bc(1)">Reveal all</button><button onclick="bst=0;render()">← Blurt again</button>${bs<BL.length-1?'<button onclick="bs++;bst=0;render()">Next section →</button>':''}</div><div id="bsc" class="small"></div></div>`}
let prev='fc';
function doS(){const v=$('q').value.trim();if(v){if(tab!='se')prev=tab;tab='se'}else if(tab=='se')tab=prev;render()}
function se(){const v=$('q').value.trim().toLowerCase(),ts=v.split(' ').filter(Boolean);
const ok=t=>{t=t.toLowerCase();return ts.every(w=>t.includes(w))};
const hl=t=>{let o='',lo=t.toLowerCase(),i=0;while(i<t.length){let ml=0;for(const w of ts)if(lo.startsWith(w,i)&&w.length>ml)ml=w.length;if(ml){o+='<mark>'+t.substr(i,ml)+'</mark>';i+=ml}else{o+=t[i];i++}}return o};
const cs=C.filter(c=>ok(c[0]+' '+c[2]+' '+c[3])),ns=N.filter(n=>ok(n[0]+' '+n[1].replace(/<[^>]+>/g,' '))),ds=D.filter(r=>ok(r.join(' '))),ps=P.filter(p=>ok(p.join(' '))),qs=Q.filter(q=>ok(q[0]+' '+q[1].join(' ')+' '+q[3])),ks=[];
K.forEach(s=>s[1].forEach(q=>{if(ok(q[0]+' '+q[1].join(' ')+' '+(q[3]||'')))ks.push([s[0],q])}));
const n=cs.length+ns.length+ds.length+ps.length+qs.length+ks.length;
let h=`<div class="small">${n} results for <b>${v}</b> in flashcards, notes, drugs, SG questions and quizzes</div>`;
if(!n)h+='<div class="card">No matches. Try a shorter word or a different spelling (e.g. "EPSP", "Na+", "astrocyte").</div>';
if(cs.length)h+=`<h3>Flashcards (${cs.length})</h3>`+cs.map(c=>`<div class="card"><div class="tag">${c[1]?'<span class="star">★ </span>':''}${sg(c)?'<span class="star" style="color:var(--ok)">SG </span>':''}${c[0]}</div><b>${hl(c[2])}</b><div>${hl(c[3])}</div></div>`).join('');
if(ns.length)h+=`<h3>Notes, tables + flowcharts (${ns.length})</h3>`+ns.map(x=>`<details class="card" open><summary>${hl(x[0])}</summary>${x[1].replace(/>([^<]+)</g,(m,t)=>'>'+hl(t)+'<')}</details>`).join('');
if(ds.length)h+=`<h3>Drugs (${ds.length})</h3><div class="card"><table>${ds.map(r=>`<tr>${r.map(c=>`<td>${hl(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
if(ps.length)h+=`<h3>Study guide questions (${ps.length})</h3>`+ps.map(p=>`<details class="card" open><summary>${hl(p[0])}</summary><p>${hl(p[1])}</p></details>`).join('');
if(ks.length)h+=`<h3>Kahoot questions (${ks.length})</h3>`+ks.map(([s,q])=>`<div class="card"><div class="tag">${s}</div><b>${hl(q[0])}</b><ul>${q[1].map((o,j)=>q[2].includes(j)?`<li><b>✓ ${hl(o)}</b></li>`:`<li>${hl(o)}</li>`).join('')}</ul>${q[3]?`<div class="small">${hl(q[3])}</div>`:''}</div>`).join('');
if(qs.length)h+=`<h3>Quiz questions (${qs.length})</h3>`+qs.map(q=>`<div class="card"><b>${hl(q[0])}</b><ul>${q[1].map((o,j)=>j==q[2]?`<li><b>✓ ${hl(o)}</b></li>`:`<li>${hl(o)}</li>`).join('')}</ul><div class="small">${hl(q[3])}</div></div>`).join('');
$('v').innerHTML=h}
function nt(){$('v').innerHTML='<p class="small">Tap a section to open. These tables and flowcharts follow the slide order; ★ marks red-ink items.</p>'+N.map(n=>`<details class="card"><summary>${n[0]}</summary>${n[1]}</details>`).join('')}
render();
</script></body></html>
